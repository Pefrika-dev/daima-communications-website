<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Illustrative product render — demonstration catalogue">
<title>Illustrative product render — demonstration catalogue</title>
<defs>
    <linearGradient id="ahpkeyboard-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <radialGradient id="ahpkeyboard-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#4a5768" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#4a5768" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4a5768" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ahpkeyboard-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#0a1020" opacity=".06"/>
    </pattern>
    <filter id="ahpkeyboard-sh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#081020" flood-opacity=".26"/>
    </filter>
    <filter id="ahpkeyboard-sh-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081020" flood-opacity=".18"/>
    </filter>
    <filter id="ahpkeyboard-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="ahpkeyboard-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="ahpkeyboard-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs><defs>
    <linearGradient id="ahpkeyboard-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".42" stop-color="#222937"/>
      <stop offset=".62" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#222937"/>
    </linearGradient>
    <linearGradient id="ahpkeyboard-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".08" stop-color="#343d4e"/>
      <stop offset=".5" stop-color="#222937"/>
      <stop offset=".92" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#454e60"/>
    </linearGradient>
    <linearGradient id="ahpkeyboard-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10296b"/>
      <stop offset=".55" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#04a6c8"/>
    </linearGradient>
    <radialGradient id="ahpkeyboard-sglow" cx="30%" cy="24%" r="72%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3f7dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0a1030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ahpkeyboard-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="ahpkeyboard-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4a5e"/>
      <stop offset=".45" stop-color="#10151f"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <clipPath id="ahpkeyboard-scrclip"><rect x="16" y="16" width="268" height="578" rx="34"/></clipPath>
  </defs>
