<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Illustrative product render — demonstration catalogue">
<title>Illustrative product render — demonstration catalogue</title>
<defs>
    <linearGradient id="alogitechmouse-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#f0f2f5"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <radialGradient id="alogitechmouse-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#5c6a7e" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#5c6a7e" stop-opacity=".08"/>
      <stop offset="1" stop-color="#5c6a7e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="alogitechmouse-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#0a1020" opacity=".06"/>
    </pattern>
    <filter id="alogitechmouse-sh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#081020" flood-opacity=".26"/>
    </filter>
    <filter id="alogitechmouse-sh-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081020" flood-opacity=".18"/>
    </filter>
    <filter id="alogitechmouse-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="alogitechmouse-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="alogitechmouse-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs><defs>
    <linearGradient id="alogitechmouse-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".42" stop-color="#222937"/>
      <stop offset=".62" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#222937"/>
    </linearGradient>
    <linearGradient id="alogitechmouse-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".08" stop-color="#343d4e"/>
      <stop offset=".5" stop-color="#222937"/>
      <stop offset=".92" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#454e60"/>
    </linearGradient>
    <linearGradient id="alogitechmouse-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10296b"/>
      <stop offset=".55" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#04a6c8"/>
    </linearGradient>
    <radialGradient id="alogitechmouse-sglow" cx="30%" cy="24%" r="72%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3f7dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0a1030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alogitechmouse-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="alogitechmouse-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4a5e"/>
      <stop offset=".45" stop-color="#10151f"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <clipPath id="alogitechmouse-scrclip"><rect x="16" y="16" width="268" height="578" rx="34"/></clipPath>
  </defs>
<rect width="800" height="800" fill="url(#alogitechmouse-bg)"/>
  <rect width="800" height="800" fill="url(#alogitechmouse-dots)"/>
  <circle cx="400" cy="330" r="340" fill="url(#alogitechmouse-glow)"/>
  <ellipse cx="400" cy="705" rx="230" ry="38" fill="#0a1020" opacity=".18" filter="url(#alogitechmouse-blur)"/>
  <path d="M0 610 L800 320 L800 800 L0 800 Z" fill="#ffffff" opacity=".16"/>
<g transform="translate(400 396) rotate(-12)" filter="url(#alogitechmouse-sh)">
    <path d="M0 -172 C 88 -172, 124 -92, 124 18 C 124 132, 78 194, 0 194 C -78 194, -124 132, -124 18 C -124 -92, -88 -172, 0 -172 Z" fill="#e8ecf2" stroke="#c3ccd9" stroke-width="2"/>
    <path d="M0 -172 C 42 -172, 78 -140, 96 -94 L-96 -94 C -78 -140, -42 -172, 0 -172 Z" fill="#f8fafc"/>
    <path d="M0 -94 L0 194" stroke="#c3ccd9" stroke-width="1.4"/>
    <rect x="-9" y="-118" width="18" height="52" rx="9" fill="#2b3340"/>
    <rect x="-5" y="-112" width="10" height="26" rx="5" fill="#4e5a6c"/>
    <path d="M-124 20 C -70 44, 70 44, 124 20" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
    <ellipse cx="0" cy="-40" rx="70" ry="36" fill="url(#alogitechmouse-sweep)" opacity=".18"/>
  </g>
</svg>