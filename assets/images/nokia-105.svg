<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Product image from the Daima Communications catalogue">
<title>Product image from the Daima Communications catalogue</title>
<defs>
    <linearGradient id="anokia105-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <radialGradient id="anokia105-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3c7cb8" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#3c7cb8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3c7cb8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="anokia105-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#0a1020" opacity=".06"/>
    </pattern>
    <filter id="anokia105-sh" x="-60%" y="-60%" width="220%" height="220%">
