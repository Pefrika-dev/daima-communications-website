<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Product image from the Daima Communications catalogue">
<title>Product image from the Daima Communications catalogue</title>
<defs>
    <linearGradient id="aoraimoheadphones-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#f0f1f4"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <radialGradient id="aoraimoheadphones-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#285fee" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#285fee" stop-opacity=".08"/>
      <stop offset="1" stop-color="#285fee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="aoraimoheadphones-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#0a1020" opacity=".06"/>
    </pattern>
    <filter id="aoraimoheadphones-sh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#081020" flood-opacity=".26"/>
    </filter>
    <filter id="aoraimoheadphones-sh-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081020" flood-opacity=".18"/>
    </filter>
    <filter id="aoraimoheadphones-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="aoraimoheadphones-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="aoraimoheadphones-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs><defs>
    <linearGradient id="aoraimoheadphones-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".42" stop-color="#222937"/>
      <stop offset=".62" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#222937"/>
    </linearGradient>
    <linearGradient id="aoraimoheadphones-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".08" stop-color="#343d4e"/>
      <stop offset=".5" stop-color="#222937"/>
      <stop offset=".92" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#454e60"/>
    </linearGradient>
    <linearGradient id="aoraimoheadphones-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10296b"/>
      <stop offset=".55" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#04a6c8"/>
    </linearGradient>
    <radialGradient id="aoraimoheadphones-sglow" cx="30%" cy="24%" r="72%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3f7dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0a1030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aoraimoheadphones-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="aoraimoheadphones-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4a5e"/>
      <stop offset=".45" stop-color="#10151f"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <clipPath id="aoraimoheadphones-scrclip"><rect x="16" y="16" width="268" height="578" rx="34"/></clipPath>
  </defs>
<rect width="800" height="800" fill="url(#aoraimoheadphones-bg)"/>
  <rect width="800" height="800" fill="url(#aoraimoheadphones-dots)"/>
  <circle cx="400" cy="330" r="340" fill="url(#aoraimoheadphones-glow)"/>
  <ellipse cx="400" cy="705" rx="230" ry="38" fill="#0a1020" opacity=".18" filter="url(#aoraimoheadphones-blur)"/>
  <path d="M0 610 L800 320 L800 800 L0 800 Z" fill="#ffffff" opacity=".16"/>
<g transform="translate(400 390) rotate(-6)" filter="url(#aoraimoheadphones-sh)">
    <path d="M-138 -44 C -168 -232, 168 -232, 138 -44" fill="none" stroke="#2a303c" stroke-width="32" stroke-linecap="round"/>
    <path d="M-138 -44 C -168 -232, 168 -232, 138 -44" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>
    <path d="M-108 -52 C -130 -190, 130 -190, 108 -52" fill="none" stroke="#11151f" stroke-width="16" stroke-linecap="round"/>
    <g transform="translate(-136 -24)">
      <rect x="-48" y="-66" width="96" height="132" rx="44" fill="#2a303c" stroke="#ffffff" stroke-opacity=".16"/>
      <rect x="-35" y="-53" width="70" height="106" rx="34" fill="#11151f"/>
      <ellipse cx="0" cy="0" rx="24" ry="34" fill="#05080e" opacity=".55"/>
      <rect x="-52" y="-18" width="8" height="36" rx="4" fill="#ffffff" opacity=".1"/>
    </g>
    <g transform="translate(136 -24)">
      <rect x="-48" y="-66" width="96" height="132" rx="44" fill="#2a303c" stroke="#ffffff" stroke-opacity=".16"/>
      <rect x="-35" y="-53" width="70" height="106" rx="34" fill="#11151f"/>
      <ellipse cx="0" cy="0" rx="24" ry="34" fill="#05080e" opacity=".55"/>
      <rect x="44" y="-18" width="8" height="36" rx="4" fill="#ffffff" opacity=".1"/>
      <circle cx="0" cy="38" r="7" fill="#285fee"/>
    </g>
    <path d="M-110 -70 C -80 -190, 80 -190, 110 -70" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="7"/>
  </g>
</svg>