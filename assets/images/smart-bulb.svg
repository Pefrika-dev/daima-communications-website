<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Illustrative product render — demonstration catalogue">
<title>Illustrative product render — demonstration catalogue</title>
<defs>
    <linearGradient id="asmartbulb-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#eff4fa"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <radialGradient id="asmartbulb-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#66bfff" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#66bfff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#66bfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="asmartbulb-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#0a1020" opacity=".06"/>
    </pattern>
    <filter id="asmartbulb-sh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#081020" flood-opacity=".26"/>
    </filter>
    <filter id="asmartbulb-sh-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081020" flood-opacity=".18"/>
    </filter>
    <filter id="asmartbulb-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="asmartbulb-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="asmartbulb-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs><defs>
    <linearGradient id="asmartbulb-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".42" stop-color="#222937"/>
      <stop offset=".62" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#222937"/>
    </linearGradient>
    <linearGradient id="asmartbulb-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".08" stop-color="#343d4e"/>
      <stop offset=".5" stop-color="#222937"/>
      <stop offset=".92" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#454e60"/>
    </linearGradient>
    <linearGradient id="asmartbulb-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10296b"/>
      <stop offset=".55" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#04a6c8"/>
    </linearGradient>
    <radialGradient id="asmartbulb-sglow" cx="30%" cy="24%" r="72%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3f7dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0a1030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asmartbulb-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="asmartbulb-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4a5e"/>
      <stop offset=".45" stop-color="#10151f"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <clipPath id="asmartbulb-scrclip"><rect x="16" y="16" width="268" height="578" rx="34"/></clipPath>
  </defs>
<rect width="800" height="800" fill="url(#asmartbulb-bg)"/>
  <rect width="800" height="800" fill="url(#asmartbulb-dots)"/>
  <circle cx="400" cy="330" r="340" fill="url(#asmartbulb-glow)"/>
  <ellipse cx="400" cy="705" rx="230" ry="38" fill="#0a1020" opacity=".18" filter="url(#asmartbulb-blur)"/>
  <path d="M0 610 L800 320 L800 800 L0 800 Z" fill="#ffffff" opacity=".16"/>
<g transform="translate(400 386) rotate(-5)" filter="url(#asmartbulb-sh)">
    <circle cx="0" cy="-56" r="150" fill="#8fd2ff" opacity=".14" filter="url(#asmartbulb-blur)"/>
    <path d="M0 -216 C 92 -216, 152 -142, 152 -48 C 152 32, 104 86, 68 122 L68 156 L-68 156 L-68 122 C -104 86, -152 32, -152 -48 C -152 -142, -92 -216, 0 -216 Z" fill="#eef8ff" stroke="#bcd7ea" stroke-width="2"/>
    <path d="M-104 -128 C -64 -196, 44 -200, 104 -134" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="5"/>
    <path d="M-86 -34 C -70 -84, -20 -110, 30 -96" fill="none" stroke="#a8e0ff" stroke-opacity=".8" stroke-width="4" stroke-linecap="round"/>
    <rect x="-70" y="156" width="140" height="26" rx="8" fill="#c8d2de"/>
    <rect x="-62" y="182" width="124" height="18" rx="6" fill="#b3bfcd"/>
    <rect x="-54" y="200" width="108" height="12" rx="6" fill="#a4b1c0"/>
    <path d="M-110 60 L110 60" stroke="#ffffff" stroke-opacity=".4" stroke-width="2"/>
    <path d="M0 -180 L0 80" stroke="#ffffff" stroke-opacity=".2"/>
  </g>
</svg>