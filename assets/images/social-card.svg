  <text x="80" y="592" fill="#5f7597" font-family="Segoe UI, Arial" font-size="12">Sirare &amp; Kehancha · One business number · Representative product image</text>
  <g transform="translate(965 330) rotate(-8)" filter="url(#sc-sh)">
