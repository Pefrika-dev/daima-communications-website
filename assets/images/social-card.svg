    <rect x="-136" y="-266" width="272" height="532" rx="40" fill="url(#sc-scr)"/>
    <ellipse cx="-20" cy="-80" rx="180" ry="220" fill="#8fd8ff" opacity=".25" filter="url(#sc-sh)"/>
    <circle cx="0" cy="-236" r="7" fill="#020306"/>
