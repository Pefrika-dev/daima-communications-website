<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Illustrative product render — demonstration catalogue">
<title>Illustrative product render — demonstration catalogue</title>
<defs>
    <linearGradient id="ausbchub-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#eff2f6"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <radialGradient id="ausbchub-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#4a5768" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#4a5768" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4a5768" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ausbchub-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#0a1020" opacity=".06"/>
    </pattern>
    <filter id="ausbchub-sh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#081020" flood-opacity=".26"/>
    </filter>
    <filter id="ausbchub-sh-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081020" flood-opacity=".18"/>
    </filter>
    <filter id="ausbchub-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="ausbchub-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="ausbchub-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs><defs>
    <linearGradient id="ausbchub-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".42" stop-color="#222937"/>
      <stop offset=".62" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#222937"/>
    </linearGradient>
    <linearGradient id="ausbchub-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".08" stop-color="#343d4e"/>
      <stop offset=".5" stop-color="#222937"/>
      <stop offset=".92" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#454e60"/>
    </linearGradient>
    <linearGradient id="ausbchub-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10296b"/>
      <stop offset=".55" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#04a6c8"/>
    </linearGradient>
    <radialGradient id="ausbchub-sglow" cx="30%" cy="24%" r="72%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3f7dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0a1030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ausbchub-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="ausbchub-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4a5e"/>
      <stop offset=".45" stop-color="#10151f"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <clipPath id="ausbchub-scrclip"><rect x="16" y="16" width="268" height="578" rx="34"/></clipPath>
  </defs>
<rect width="800" height="800" fill="url(#ausbchub-bg)"/>
  <rect width="800" height="800" fill="url(#ausbchub-dots)"/>
  <circle cx="400" cy="330" r="340" fill="url(#ausbchub-glow)"/>
  <ellipse cx="400" cy="705" rx="230" ry="38" fill="#0a1020" opacity=".18" filter="url(#ausbchub-blur)"/>
  <path d="M0 610 L800 320 L800 800 L0 800 Z" fill="#ffffff" opacity=".16"/>
<g transform="translate(400 400) rotate(-8)" filter="url(#ausbchub-sh)">
    <rect x="-190" y="-58" width="380" height="116" rx="26" fill="#cfd6df" stroke="#ffffff" stroke-opacity=".7" stroke-width="2"/>
    <rect x="-190" y="-58" width="380" height="26" rx="13" fill="#e6ebf1"/>
    <rect x="-154" y="-14" width="302" height="42" rx="12" fill="#b6c0cc"/>
    <g transform="translate(44 7)"><rect x="-86" y="-9" width="26" height="18" rx="5" fill="#1a2230"/><rect x="-80" y="-3" width="14" height="5" rx="2.5" fill="#3e4a5b"/><rect x="-48" y="-9" width="26" height="18" rx="5" fill="#1a2230"/><rect x="-42" y="-3" width="14" height="5" rx="2.5" fill="#3e4a5b"/><rect x="-10" y="-9" width="26" height="18" rx="5" fill="#1a2230"/><rect x="-4" y="-3" width="14" height="5" rx="2.5" fill="#3e4a5b"/><rect x="28" y="-9" width="26" height="18" rx="5" fill="#1a2230"/><rect x="34" y="-3" width="14" height="5" rx="2.5" fill="#3e4a5b"/></g>
    <rect x="-134" y="1" width="42" height="22" rx="6" fill="#232c39"/>
    <rect x="-122" y="7" width="18" height="10" rx="4" fill="#0a0e15"/>
    <path d="M190 16 C 260 6, 268 -58, 214 -92" fill="none" stroke="#2b3340" stroke-width="10" stroke-linecap="round"/>
    <rect x="196" y="-116" width="38" height="18" rx="7" fill="#d7dde5" transform="rotate(-20 215 -107)"/>
    <text x="-60" y="-38" fill="#4a5565" font-family="Segoe UI, Arial" font-size="9" letter-spacing="3">MULTI-PORT · DEMO</text>
  </g>
</svg>