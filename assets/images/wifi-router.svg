<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Product image from the Daima Communications catalogue">
<title>Product image from the Daima Communications catalogue</title>
<defs>
    <linearGradient id="awifirouter-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#edf4fa"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <radialGradient id="awifirouter-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#285fee" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#285fee" stop-opacity=".08"/>
      <stop offset="1" stop-color="#285fee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="awifirouter-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#0a1020" opacity=".06"/>
    </pattern>
    <filter id="awifirouter-sh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#081020" flood-opacity=".26"/>
    </filter>
    <filter id="awifirouter-sh-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081020" flood-opacity=".18"/>
    </filter>
    <filter id="awifirouter-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="awifirouter-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="awifirouter-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs><defs>
    <linearGradient id="awifirouter-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".42" stop-color="#222937"/>
      <stop offset=".62" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#222937"/>
    </linearGradient>
    <linearGradient id="awifirouter-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".08" stop-color="#343d4e"/>
      <stop offset=".5" stop-color="#222937"/>
      <stop offset=".92" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#454e60"/>
    </linearGradient>
    <linearGradient id="awifirouter-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10296b"/>
      <stop offset=".55" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#04a6c8"/>
    </linearGradient>
    <radialGradient id="awifirouter-sglow" cx="30%" cy="24%" r="72%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3f7dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0a1030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="awifirouter-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="awifirouter-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4a5e"/>
      <stop offset=".45" stop-color="#10151f"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <clipPath id="awifirouter-scrclip"><rect x="16" y="16" width="268" height="578" rx="34"/></clipPath>
  </defs>
<rect width="800" height="800" fill="url(#awifirouter-bg)"/>
  <rect width="800" height="800" fill="url(#awifirouter-dots)"/>
  <circle cx="400" cy="330" r="340" fill="url(#awifirouter-glow)"/>
  <ellipse cx="400" cy="705" rx="230" ry="38" fill="#0a1020" opacity=".18" filter="url(#awifirouter-blur)"/>
  <path d="M0 610 L800 320 L800 800 L0 800 Z" fill="#ffffff" opacity=".16"/>
<g transform="translate(400 410) rotate(-4)" filter="url(#awifirouter-sh)">
    <g stroke="#d6dee8" stroke-width="9" stroke-linecap="round">
      <path d="M-108 -38 L-160 -190"/>
      <path d="M-56 -48 L-82 -206"/>
      <path d="M56 -48 L82 -206"/>
      <path d="M108 -38 L160 -190"/>
    </g>
    <g fill="#eef2f7" stroke="#c3cedb" stroke-width="2">
      <rect x="-152" y="-90" width="304" height="132" rx="32" transform="rotate(-4)"/>
    </g>
    <rect x="-132" y="-64" width="264" height="80" rx="22" fill="#f9fbfd"/>
    <circle cx="-88" cy="-24" r="5" fill="#285fee"/>
    <circle cx="-68" cy="-24" r="5" fill="#39c98a"/>
    <circle cx="-48" cy="-24" r="5" fill="#ffc247"/>
    <text x="80" y="-18" fill="#7a8698" font-family="Segoe UI, Arial" font-size="9" letter-spacing="2">DAIMA</text>
    <path d="M-152 -10 L152 -10" stroke="#dfe6ef" stroke-width="2"/>
    <path d="M-152 42 L152 42" stroke="#ffffff" stroke-opacity=".7" stroke-width="2"/>
  </g>
</svg>