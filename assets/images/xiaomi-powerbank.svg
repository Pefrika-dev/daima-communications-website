<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Illustrative product render — demonstration catalogue">
<title>Illustrative product render — demonstration catalogue</title>
<defs>
    <linearGradient id="axiaomipowerbank-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset=".55" stop-color="#f1f2f4"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <radialGradient id="axiaomipowerbank-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#6a7688" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#6a7688" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6a7688" stop-opacity="0"/>
    </radialGradient>
    <pattern id="axiaomipowerbank-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#0a1020" opacity=".06"/>
    </pattern>
    <filter id="axiaomipowerbank-sh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#081020" flood-opacity=".26"/>
    </filter>
    <filter id="axiaomipowerbank-sh-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081020" flood-opacity=".18"/>
    </filter>
    <filter id="axiaomipowerbank-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="axiaomipowerbank-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="axiaomipowerbank-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs><defs>
    <linearGradient id="axiaomipowerbank-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".42" stop-color="#222937"/>
      <stop offset=".62" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#222937"/>
    </linearGradient>
    <linearGradient id="axiaomipowerbank-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454e60"/>
      <stop offset=".08" stop-color="#343d4e"/>
      <stop offset=".5" stop-color="#222937"/>
      <stop offset=".92" stop-color="#343d4e"/>
      <stop offset="1" stop-color="#454e60"/>
    </linearGradient>
    <linearGradient id="axiaomipowerbank-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10296b"/>
      <stop offset=".55" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#04a6c8"/>
    </linearGradient>
    <radialGradient id="axiaomipowerbank-sglow" cx="30%" cy="24%" r="72%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3f7dff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0a1030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="axiaomipowerbank-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="axiaomipowerbank-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4a5e"/>
      <stop offset=".45" stop-color="#10151f"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <clipPath id="axiaomipowerbank-scrclip"><rect x="16" y="16" width="268" height="578" rx="34"/></clipPath>
  </defs>
<rect width="800" height="800" fill="url(#axiaomipowerbank-bg)"/>
  <rect width="800" height="800" fill="url(#axiaomipowerbank-dots)"/>
  <circle cx="400" cy="330" r="340" fill="url(#axiaomipowerbank-glow)"/>
  <ellipse cx="400" cy="705" rx="230" ry="38" fill="#0a1020" opacity=".18" filter="url(#axiaomipowerbank-blur)"/>
  <path d="M0 610 L800 320 L800 800 L0 800 Z" fill="#ffffff" opacity=".16"/>
<g transform="translate(400 400) rotate(-12)" filter="url(#axiaomipowerbank-sh)">
    <rect x="-122" y="-192" width="244" height="384" rx="34" fill="#c9d0d8" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="-114" y="-184" width="228" height="368" rx="28" fill="none" stroke="#000" stroke-opacity=".3"/>
    <path d="M-122 -160 L122 -192 L122 -120 L-122 -88 Z" fill="#ffffff" opacity=".05"/>
    <rect x="-84" y="-140" width="168" height="88" rx="14" fill="#0b1018" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="0" y="-96" text-anchor="middle" fill="#2d3540" font-family="Segoe UI, Arial" font-size="30" font-weight="700">10K</text>
    <text x="0" y="-72" text-anchor="middle" fill="#ffffff" fill-opacity=".45" font-family="Segoe UI, Arial" font-size="10" letter-spacing="3">mAh · DEMO</text>
    <g transform="translate(-44 30)">
      <rect x="0" y="0" width="18" height="6" rx="3" fill="#2d3540"/><rect x="26" y="0" width="18" height="6" rx="3" fill="#2d3540"/><rect x="52" y="0" width="18" height="6" rx="3" fill="#2d3540"/><rect x="78" y="0" width="18" height="6" rx="3" fill="#37404f"/>
    </g>
    <rect x="-84" y="72" width="64" height="26" rx="8" fill="#090d14" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="-74" y="80" width="44" height="10" rx="5" fill="#1d2531"/>
    <rect x="20" y="72" width="64" height="26" rx="8" fill="#090d14" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="30" y="80" width="44" height="10" rx="5" fill="#1d2531"/>
    <text x="0" y="150" text-anchor="middle" fill="#ffffff" fill-opacity=".25" font-family="Segoe UI, Arial" font-size="9" letter-spacing="4">FAST CHARGE</text>
    <rect x="-122" y="-192" width="244" height="384" rx="34" fill="url(#axiaomipowerbank-sweep)" opacity=".12"/>
  </g>
</svg>